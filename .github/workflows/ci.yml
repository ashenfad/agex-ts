name: CI

on:
  push:
    branches: [main, init, nxt, rebuild]
  pull_request:

# Cancel an in-flight run for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so cross-package type imports resolve via the
      # `dist/*.d.ts` paths declared in each package's `exports` map
      # (e.g. `termish-ts` importing `kvgit-ts`).
      - name: Build
        run: pnpm build

      # Scan every package's `dist/` for browser-hostile patterns
      # (`createRequire`, `node:module`, `worker_threads`, etc.) that
      # leak into bundles consumed by browser apps. See
      # `scripts/check-dist-shape.mjs` for the rules + per-package
      # allowlist.
      - name: Bundle-shape check
        run: pnpm check:dist

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Node + fake-indexeddb)
        run: pnpm test

  browser:
    name: Browser tests (real IndexedDB, OPFS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every browser in one call: with a second `playwright install`
      # for Firefox and WebKit, Chromium's headless shell went missing.
      - name: Install Playwright Chromium, Firefox and WebKit (with system deps)
        run: pnpm --filter kvgit-ts exec playwright install chromium firefox webkit --with-deps

      - name: kvgit-ts (Chromium + real IndexedDB)
        run: pnpm --filter kvgit-ts test:browser

      - name: kvsql (Chromium, Firefox, WebKit)
        run: |
          pnpm --filter kvsql test:browser
          pnpm --filter kvsql test:browser --browser.name=firefox
          pnpm --filter kvsql test:browser --browser.name=webkit

